# Packaging for version 0.1: an unsigned portable build for Windows.
# The NSIS installer, code signing, and automatic updates are planned for version 0.5.
appId: net.omisoft.omireminder
productName: OmiReminder
copyright: Copyright (c) 2026 Yevhen Sakara

directories:
  output: dist
  buildResources: build

# Chromium UI translations. The app supports English and Ukrainian only (FR-L10N-1).
electronLanguages:
  - en-US
  - uk

# electron-vite bundles all code into out/, so no node_modules are needed at runtime.
files:
  - out/**/*
  - package.json

# Replaces LICENSES.chromium.html (20 MB) with a short note that links to it.
afterPack: build/afterPack.cjs

win:
  icon: build/icon.png
  target:
    # A single .exe that runs without installation.
    - target: portable
      arch: x64
    # The same app as a plain folder with OmiReminder.exe.
    - target: dir
      arch: x64

portable:
  artifactName: ${productName}-${version}-portable.exe
